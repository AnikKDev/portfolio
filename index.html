  <style>
    :root {
      --bg: #0b0f14;
      --panel: #0f141b;
      --bar: #161b22;
      --line: #232a33;
      --text: #c9d1d9;
      --dim: #7d8590;
      --green: #7ee787;
      --blue: #79c0ff;
      --amber: #e3b341;
      --purple: #d2a8ff;
      --red: #ff7b72;
      --strong: #ffffff;
      --glow: #131a23;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    [data-theme="dracula"] { --bg:#1e1f29; --panel:#282a36; --bar:#21222c; --line:#3b3e51; --text:#f8f8f2; --dim:#8b93b8; --green:#50fa7b; --blue:#8be9fd; --amber:#f1fa8c; --purple:#bd93f9; --red:#ff5555; --strong:#ffffff; --glow:#2c2e3e; }
    [data-theme="solarized"] { --bg:#001e26; --panel:#002b36; --bar:#073642; --line:#0f4552; --text:#93a1a1; --dim:#657b83; --green:#859900; --blue:#268bd2; --amber:#b58900; --purple:#6c71c4; --red:#dc322f; --strong:#eee8d5; --glow:#03303b; }
    [data-theme="light"] { --bg:#eef1f5; --panel:#ffffff; --bar:#f3f5f8; --line:#d8dee4; --text:#24292f; --dim:#6e7781; --green:#1a7f37; --blue:#0969da; --amber:#9a6700; --purple:#8250df; --red:#cf222e; --strong:#0b0f14; --glow:#ffffff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, var(--glow) 0%, var(--bg) 60%);
      color: var(--text);
      font: 14px/1.65 var(--mono);
      -webkit-font-smoothing: antialiased;
      display: flex; justify-content: center;
      padding: 32px 16px;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* Window */
    .term {
      width: 100%; max-width: 980px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      display: flex; flex-direction: column;
      height: calc(100vh - 64px); min-height: 520px;
      overflow: hidden;
    }
    .bar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      user-select: none;
    }
    .dots { display: flex; gap: 8px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    .dots span:nth-child(1) { background: #ff5f57; }
    .dots span:nth-child(2) { background: #febc2e; }
    .dots span:nth-child(3) { background: #28c840; }
    .bar .title { flex: 1; text-align: center; color: var(--dim); font-size: 12.5px; }
    .bar nav { display: flex; gap: 14px; font-size: 12.5px; }
    .bar nav a { color: var(--dim); }
    .bar nav a:hover { color: var(--text); }

    .screen { position: relative; flex: 1; overflow-y: auto; padding: 20px 22px 8px; }
    .screen::-webkit-scrollbar { width: 10px; }
    .screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--panel); }

    /* Prompt lines */
    .cmd { margin: 20px 0 6px; white-space: pre-wrap; word-break: break-word; }
    .ps1-user { color: var(--green); font-weight: 500; }
    .ps1-path { color: var(--blue); font-weight: 500; }
    .ps1-sign { color: var(--dim); }
    .out p { margin: 0 0 8px; max-width: 78ch; }
    .dim { color: var(--dim); }
    .g { color: var(--green); } .a { color: var(--amber); } .r { color: var(--red); } .b { color: var(--blue); }
    h1, h3 { font-size: inherit; margin: 0; font-weight: 700; }

    /* whoami */
    .hero { display: grid; grid-template-columns: 132px 1fr; gap: 22px; align-items: center; margin: 6px 0 4px; }
    .avatar { width: 132px; height: 132px; border-radius: 8px; border: 1px solid var(--line); filter: grayscale(1) contrast(1.05); object-fit: cover; display: block; }
    .hero h1 { font-size: 22px; color: var(--strong); letter-spacing: -.2px; }
    .hero .role { color: var(--green); margin: 2px 0 8px; }
    .kv { display: grid; grid-template-columns: max-content 1fr; column-gap: 14px; row-gap: 2px; margin: 4px 0; }
    .kv dt { color: var(--dim); }
    .kv dd { margin: 0; word-break: break-word; }

    /* experience */
    .job { margin: 10px 0 14px; padding-left: 14px; border-left: 2px solid var(--line); }
    .job.current { border-left-color: var(--green); }
    .job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; }
    .job-head h3 { color: var(--strong); }
    .job-head .at { color: var(--blue); font-weight: 400; }
    .job .when { color: var(--dim); }
    .job ul { list-style: none; padding: 0; margin: 4px 0; }
    .job li { padding-left: 18px; position: relative; }
    .job li::before { content: "›"; position: absolute; left: 4px; color: var(--green); }
    .tags { color: var(--purple); font-size: 12.5px; }

    /* skills */
    .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 24px; }
    .skills h3 { color: var(--amber); font-weight: 500; }
    .skills h3::before { content: "▸ "; color: var(--dim); }
    .skills div > span { display: block; padding-left: 16px; }

    /* neofetch */
    .neo { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; margin: 4px 0; }
    .neo pre { margin: 0; color: var(--green); font: inherit; line-height: 1.25; font-weight: 700; }
    .neo .info { min-width: 0; }
    .neo .info .k { color: var(--green); font-weight: 500; }
    .neo .rule { color: var(--dim); }
    .swatches { display: flex; margin-top: 8px; }
    .swatches span { width: 22px; height: 14px; }
    .typing::after { content: ""; display: inline-block; width: .55em; height: 1.05em; margin-left: 1px; vertical-align: text-bottom; background: var(--green); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pending { display: none !important; }

    /* help table */
    .help { display: grid; grid-template-columns: max-content 1fr; column-gap: 22px; }
    .hist { white-space: pre; }
    .help code { color: var(--green); font-family: inherit; }

    /* input */
    .prompt-row { display: flex; align-items: baseline; margin: 20px 0 10px; }
    .prompt-row label { white-space: nowrap; }
    #cli {
      flex: 1; min-width: 0;
      background: transparent; border: 0; outline: 0;
      color: var(--text); font: inherit; caret-color: var(--green);
      padding: 0 0 0 8px;
    }

    /* quick command chips */
    .chips {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bar);
    }
    .chips button {
      font: inherit; font-size: 12.5px; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      padding: 5px 10px; cursor: pointer;
    }
    .chips button:hover { border-color: var(--green); color: var(--green); }
    .chips button span { color: var(--dim); }

    @media (max-width: 640px) {
      body { padding: 0; font-size: 13px; }
      .term { height: 100vh; height: 100dvh; border-radius: 0; border: 0; min-height: 0; }
      .bar nav { display: none; }
      .bar .title { text-align: left; }
      .bar { padding-top: calc(10px + env(safe-area-inset-top)); }
      .screen { padding: 16px 14px 8px; }
      .hero { grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
      .hero > div { display: contents; }
      .hero h1, .hero .role { grid-column: 2; }
      .hero h1 { align-self: end; }
      .hero .role { margin-top: -10px; }
      .hero p { grid-column: 1 / -1; }
      .avatar { width: 72px; height: 72px; grid-row: 1 / span 2; }
      .skills div > span { display: inline; padding-left: 0; }
      .skills div > span:not(:last-child)::after { content: " · "; color: var(--dim); }
      .skills h3 { display: block; }
      .hero h1 { font-size: 19px; }
      .chips { flex-wrap: nowrap; overflow-x: auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
      .chips button { flex: 0 0 auto; }
      #cli { font-size: 16px; }
      .neo { gap: 12px; }
      .neo pre { font-size: 10px; } /* stops iOS zooming in on focus */
    }
  </style>
</head>

  <script>
    (() => {
      const LINKS = {
        cv: "https://drive.google.com/file/d/1xlJ-ARhHeJMJVMWVpPzCWSFuYNJdpKlH/view?usp=sharing",
        github: "https://github.com/anikkdev",
        linkedin: "https://linkedin.com/in/anikkdev",
        email: "mailto:anikdev2016@gmail.com",
      };
      const SECTIONS = { neofetch: "neofetch", whoami: "whoami", experience: "ls -l ~/experience", skills: "cat skills.txt", achievements: "cat achievements.log", contact: "contact --all" };
      const ALIASES = { about: "whoami", work: "experience", jobs: "experience", stack: "skills", awards: "achievements", resume: "cv", mail: "email" };
      const COMMANDS = ["help", ...Object.keys(SECTIONS), "cv", "github", "linkedin", "email", "all", "theme", "history", "clear", "ls", "pwd", "date", "echo"];
      const THEMES = ["default", "dracula", "solarized", "light"];
      const CAREER_START = new Date(2022, 7, 1); // Aug 2022
      const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
      const sstore = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };

      function uptime() {
        const now = new Date();
        let m = (now.getFullYear() - CAREER_START.getFullYear()) * 12 + now.getMonth() - CAREER_START.getMonth();
        const y = Math.floor(m / 12); m = m % 12;
        return `${y} year${y === 1 ? "" : "s"}${m ? `, ${m} month${m === 1 ? "" : "s"}` : ""}`;
      }
      let currentTheme = "default";
      function setTheme(name) {
        currentTheme = name;
        if (name === "default") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", name);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bar").trim());
        store.set("theme", name);
      }
      const savedTheme = store.get("theme");
      if (THEMES.includes(savedTheme)) setTheme(savedTheme);

      const screen = document.getElementById("screen");
      const session = document.getElementById("session");
      const historyEl = document.getElementById("history");
      const cli = document.getElementById("cli");
      const past = [];
      let cursor = 0;

      const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const ps1 = (t) => `<span class="ps1-user">anik@portfolio</span><span class="ps1-sign">:</span><span class="ps1-path">~</span><span class="ps1-sign">$</span> ${esc(t)}`;
      const tpl = (name) => {
        const frag = document.getElementById("t-" + name).content.cloneNode(true);
        frag.querySelectorAll("[data-uptime]").forEach((el) => (el.textContent = name === "neofetch" ? uptime() : uptime().split(",")[0]));
        return frag;
      };
      const html = (s) => { const d = document.createElement("div"); d.innerHTML = s; return d; };

      function block(cmdText, content) {
        const wrap = document.createElement("section");
        const line = document.createElement("div");
        line.className = "cmd";
        line.innerHTML = ps1(cmdText);
        wrap.appendChild(line);
        if (content) {
          const out = document.createElement("div");
          out.className = "out";
          out.appendChild(content);
          wrap.appendChild(out);
        }
        return wrap;
      }

      // Initial session: print every section, like someone already ran them.
      // On the first visit, the first command is typed out; everything else appears once it finishes.
      document.getElementById("lastlogin").textContent = new Date().toDateString();
      const blocks = Object.entries(SECTIONS).map(([name, label]) => block(label, tpl(name)));
      blocks.forEach((b) => session.appendChild(b));
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !sstore.get("typed")) {
        sstore.set("typed", "1");
        const first = blocks[0];
        const line = first.querySelector(".cmd");
        const label = Object.values(SECTIONS)[0];
        const hidden = [first.querySelector(".out"), ...blocks.slice(1), document.getElementById("form")];
        hidden.forEach((el) => el.classList.add("pending"));
        line.innerHTML = ps1("");
        const typed = document.createElement("span");
        typed.className = "typing";
        line.appendChild(typed);
        let i = 0;
        const tick = () => {
          typed.textContent = label.slice(0, ++i);
          if (i < label.length) setTimeout(tick, 70 + Math.random() * 60);
          else setTimeout(() => { typed.classList.remove("typing"); hidden.forEach((el) => el.classList.remove("pending")); }, 350);
        };
        setTimeout(tick, 450);
      }

      function open(url) {
        if (url.startsWith("mailto:")) location.href = url;
        else window.open(url, "_blank", "noopener");
      }

      function run(raw) {
        const input = raw.trim();
        if (input) past.push(input);
        cursor = past.length;
        const [first, ...rest] = input.split(/\s+/);
        const cmd = ALIASES[(first || "").toLowerCase()] || (first || "").toLowerCase();

        if (cmd === "clear") {
          session.innerHTML = historyEl.innerHTML = "";
          document.getElementById("motd").innerHTML = "";
          return;
        }

        let out = null;
        if (!input) out = null;
        else if (cmd in SECTIONS || cmd === "help") out = tpl(cmd);
        else if (cmd === "all") {
          out = document.createDocumentFragment();
          Object.keys(SECTIONS).forEach((n) => { out.appendChild(tpl(n)); out.appendChild(document.createElement("br")); });
        } else if (LINKS[cmd]) {
          out = html(`<span class="dim">opening</span> <a href="${LINKS[cmd]}" target="_blank" rel="noopener">${LINKS[cmd].replace("mailto:", "")}</a><span class="dim"> …</span>`);
          open(LINKS[cmd]);
        } else if (cmd === "theme") {
          const arg = (rest[0] || "").toLowerCase();
          const next = arg === "next" ? THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length] : arg;
          if (THEMES.includes(next)) { setTheme(next); out = html(`theme set to <span class="g">${next}</span>`); }
          else out = html(`usage: theme [${THEMES.join(" | ")}]<br><span class="dim">current:</span> ${esc(currentTheme)}`);
        } else if (cmd === "ls") out = html(`<span class="b">experience/</span>  about.txt  skills.txt  achievements.log  <span class="g">cv.pdf</span>`);
        else if (cmd === "pwd") out = html("/home/anik");
        else if (cmd === "date") out = html(esc(new Date().toString()));
        else if (cmd === "echo") out = html(esc(rest.join(" ")));
        else if (cmd === "history") out = html(past.map((c, i) => `<span class="dim hist">${String(i + 1).padStart(4, " ")}</span>  ${esc(c)}`).join("<br>"));
        else if (cmd === "sudo") out = html(`<span class="r">anik is not in the sudoers file.</span> <span class="dim">He is open to new projects though — try</span> <span class="g">contact</span>`);
        else out = html(`bash: ${esc(first)}: command not found. Type <span class="g">help</span> to see what's available.`);

        const node = block(input, out);
        historyEl.appendChild(node);
        // Show the start of the new output, not the very bottom
        requestAnimationFrame(() => { screen.scrollTop = Math.min(node.offsetTop - 12, screen.scrollHeight); });
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        run(cli.value);
        cli.value = "";
      });

      cli.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") { e.preventDefault(); if (cursor > 0) cli.value = past[--cursor]; }
        else if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(past.length, cursor + 1); cli.value = past[cursor] || ""; }
        else if (e.key === "Tab") {
          const v = cli.value.toLowerCase();
          if (!v) return; // let Tab move focus when the prompt is empty
          e.preventDefault();
          const hits = COMMANDS.filter((c) => c.startsWith(v));
          if (hits.length === 1) cli.value = hits[0];
          else if (hits.length > 1) historyEl.appendChild(block(cli.value, html(hits.join("  "))));
        } else if (e.key.toLowerCase() === "l" && e.ctrlKey) { e.preventDefault(); run("clear"); }
      });

      document.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => run(b.dataset.run)));

      // Desktop: clicking empty terminal space focuses the prompt (skipped on touch so the keyboard doesn't pop up)
      screen.addEventListener("click", (e) => {
        if (matchMedia("(pointer: fine)").matches && !getSelection().toString() && !e.target.closest("a")) cli.focus({ preventScroll: true });
      });
    })();
  </script>
</body>
</html>
